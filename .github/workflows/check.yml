name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - name: ASCII and source metadata
        run: python -m pytest tests/direct/test_contract_source.py -q
      - name: GenVM semantic lint
        run: python scripts/genvm_lint_rc.py check contracts/concord_batch.py
      - name: Direct-mode lifecycle and safety
        run: python -m pytest tests/direct -q
      - name: Deployment receipt parsers
        run: python -m pytest tests/deployment -q
